name: Autopost Telegram Crypto

# Hemat Actions (free tier):
# - Hanya 2 slot default (09:00 & 21:00 WIB) + Run manual
# - Skip cepat jika di luar jadwal schedule.json
on:
  schedule:
    # 09:00 WIB = 02:00 UTC
    - cron: '0 2 * * *'
    # 21:00 WIB = 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Paksa post sekarang (abaikan jadwal)'
        required: false
        default: false
        type: boolean
      exchange_source:
        description: 'Sumber data & tombol affiliate (auto | okx | bitget)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - okx
          - bitget
      category:
        description: 'spot | airdrop | auto'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - spot
          - airdrop

permissions:
  contents: write

concurrency:
  group: autopost-telegram
  cancel-in-progress: true

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run autopost (hormati jadwal)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_FORWARD_ENABLED: 'true'
          TELEGRAM_FORWARD_CHAT_ID: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID }}
          TELEGRAM_FORWARD_THREAD_ID: ${{ secrets.TELEGRAM_FORWARD_THREAD_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'free' }}
          EXCHANGE_SOURCE: ${{ github.event.inputs.exchange_source || 'auto' }}
          EXCHANGE_SOURCE_OVERRIDE: ${{ github.event.inputs.exchange_source && '1' || '' }}
          POST_CATEGORY: ${{ github.event.inputs.category || 'auto' }}
          FORCE_POST: ${{ github.event.inputs.force_post == true && 'true' || 'false' }}
          POST_LANGUAGE: id
          POLLINATIONS_ENABLED: ${{ vars.POLLINATIONS_ENABLED || 'true' }}
          CRON_TIMEZONE: Asia/Jakarta
          MAX_CAPTION_CHARS: '700'
          MAX_HOOK_CHARS: '60'
          MAX_INFO_CHARS: '220'
          MAX_CTA_CHARS: '80'
          ADMIN_TELEGRAM_USERNAME: jfnetworkindo
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'qwen/qwen3.8-27b:free,openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-2.5-flash' }}
        run: npm run post:once

      - name: Persist last posted slot
        if: success()
        run: |
          if git diff --quiet -- config/runtime.json; then
            echo "No runtime change"
            exit 0
          fi
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add config/runtime.json
          git commit -m "chore: mark last posted slot"
          git push
