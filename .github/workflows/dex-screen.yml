name: DEX Screen Alerts

# Screening token DEX (filter ketat) → alert Telegram.
# Default tiap 30 menit (hemat Actions). Lokal pakai: npm run dex:screen:loop (5 menit).
on:
  schedule:
    # tiap 30 menit
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (tidak kirim Telegram)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dex-screen-alerts
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run DEX screen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DEX_SCREEN_CHAT_ID: ${{ secrets.DEX_SCREEN_CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          CRON_TIMEZONE: Asia/Jakarta
          DEX_SCREEN_CHAINS: ${{ vars.DEX_SCREEN_CHAINS || 'solana,ethereum,bsc,base,arbitrum' }}
          DEX_REQUIRE_GOPLUS: ${{ vars.DEX_REQUIRE_GOPLUS || 'true' }}
          DEX_SCREEN_MAX_ALERTS: ${{ vars.DEX_SCREEN_MAX_ALERTS || '2' }}
          DEX_SCREEN_MAX_CANDIDATES: ${{ vars.DEX_SCREEN_MAX_CANDIDATES || '30' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/dexScreen.js --dry-run
          else
            node scripts/dexScreen.js
          fi

      - name: Persist anti-spam cache
        if: success()
        run: |
          if git diff --quiet -- data/dex-screen-cache.json 2>/dev/null; then
            echo "No cache change"
            exit 0
          fi
          if [ ! -f data/dex-screen-cache.json ]; then
            echo "No cache file"
            exit 0
          fi
          git config user.name "dex-screen-bot"
          git config user.email "dex-screen-bot@users.noreply.github.com"
          git add data/dex-screen-cache.json
          git commit -m "chore: dex-screen anti-spam cache" || exit 0
          git push
