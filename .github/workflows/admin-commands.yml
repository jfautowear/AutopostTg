name: Admin Telegram Commands

# Hemat Actions (free tier):
# - Command realtime = npm start di PC
# - GHA hanya backup 2x/hari + Run manual
on:
  schedule:
    # 10:00 & 22:00 WIB (= 03:00 & 15:00 UTC)
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-telegram-commands
  cancel-in-progress: true

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process admin commands
        id: cmds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          ADMIN_TELEGRAM_USERNAME: jfnetworkindo
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'free' }}
          EXCHANGE_SOURCE: auto
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLLINATIONS_ENABLED: ${{ vars.POLLINATIONS_ENABLED || 'true' }}
          MAX_CAPTION_CHARS: '700'
          MAX_HOOK_CHARS: '60'
          MAX_INFO_CHARS: '220'
          MAX_CTA_CHARS: '80'
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'qwen/qwen3.8-27b:free,openrouter/free' }}
          TELEGRAM_FORWARD_ENABLED: 'true'
          TELEGRAM_FORWARD_CHAT_ID: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID }}
          TELEGRAM_FORWARD_THREAD_ID: ${{ secrets.TELEGRAM_FORWARD_THREAD_ID }}
        run: node scripts/processCommands.js

      - name: Force post jika diminta admin
        if: steps.cmds.outputs.force_post == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_FORWARD_ENABLED: 'true'
          TELEGRAM_FORWARD_CHAT_ID: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID }}
          TELEGRAM_FORWARD_THREAD_ID: ${{ secrets.TELEGRAM_FORWARD_THREAD_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'free' }}
          FORCE_POST: 'true'
          POST_LANGUAGE: id
          POLLINATIONS_ENABLED: ${{ vars.POLLINATIONS_ENABLED || 'true' }}
          CRON_TIMEZONE: Asia/Jakarta
          MAX_CAPTION_CHARS: '700'
          MAX_HOOK_CHARS: '60'
          MAX_INFO_CHARS: '220'
          MAX_CTA_CHARS: '80'
          ADMIN_TELEGRAM_USERNAME: jfnetworkindo
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'qwen/qwen3.8-27b:free,openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-2.5-flash' }}
        run: npm run post:once -- --force
