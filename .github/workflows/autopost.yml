name: Autopost Telegram Crypto

# PC boleh OFF — semua post dijadwalkan di GitHub Actions.
# - Cron tiap jam (:07 UTC) → cek config/schedule.json (sumber kebenaran)
# - Early schedule check SEBELUM npm ci (skip cepat jika di luar slot)
# - Window 360 menit: antisipasi delay runner GitHub
# - Slot airdrop = DEX Safe Screen
on:
  schedule:
    # Tiap jam agar /jadwal_set di schedule.json ikut dipatuhi (bukan cron hardcode)
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Paksa post sekarang (abaikan jadwal)'
        required: false
        default: false
        type: boolean
      exchange_source:
        description: 'Sumber data & tombol affiliate (auto | okx | bitget)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - okx
          - bitget
      category:
        description: 'spot | airdrop | news | auto'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - spot
          - airdrop
          - news

permissions:
  contents: write

concurrency:
  group: autopost-telegram
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Early schedule check (tanpa npm)
        id: gate
        env:
          FORCE_POST: ${{ github.event.inputs.force_post == true && 'true' || 'false' }}
          # Samakan dengan step Run autopost
          SCHEDULE_WINDOW_MINUTES: '360'
          CRON_TIMEZONE: Asia/Jakarta
        run: |
          set +e
          node scripts/checkSchedule.js
          code=$?
          set -e
          if [ "$code" -eq 78 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Di luar jadwal / sudah dipost — skip install & AI"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Run autopost
        if: steps.gate.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_FORWARD_ENABLED: 'true'
          TELEGRAM_FORWARD_CHAT_ID: ${{ secrets.TELEGRAM_FORWARD_CHAT_ID }}
          TELEGRAM_FORWARD_THREAD_ID: ${{ secrets.TELEGRAM_FORWARD_THREAD_ID }}
          TEST_CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'free' }}
          EXCHANGE_SOURCE: ${{ github.event.inputs.exchange_source || 'auto' }}
          EXCHANGE_SOURCE_OVERRIDE: ${{ github.event.inputs.exchange_source && '1' || '' }}
          POST_CATEGORY: ${{ github.event.inputs.category || 'auto' }}
          FORCE_POST: ${{ github.event.inputs.force_post == true && 'true' || 'false' }}
          POST_LANGUAGE: id
          POLLINATIONS_ENABLED: ${{ vars.POLLINATIONS_ENABLED || 'true' }}
          CRON_TIMEZONE: Asia/Jakarta
          SCHEDULE_WINDOW_MINUTES: '360'
          MAX_CAPTION_CHARS: '700'
          MAX_HOOK_CHARS: '60'
          MAX_INFO_CHARS: '220'
          MAX_CTA_CHARS: '80'
          ADMIN_TELEGRAM_USERNAME: jfnetworkindo
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'qwen/qwen3.8-27b' }}
          OPENROUTER_FREE_MODEL: ${{ vars.OPENROUTER_FREE_MODEL || 'qwen/qwen3.8-27b:free,openrouter/free' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'google/gemini-2.5-flash' }}
        run: npm run post:once

      - name: Persist last posted slot + DEX cache
        if: success() && steps.gate.outputs.skip != 'true'
        run: |
          CHANGED=0
          git diff --quiet -- config/runtime.json || CHANGED=1
          git diff --quiet -- data/dex-screen-cache.json 2>/dev/null || CHANGED=1
          if [ "$CHANGED" -eq 0 ]; then
            echo "No runtime/cache change"
            exit 0
          fi
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add config/runtime.json data/dex-screen-cache.json || true
          git commit -m "chore: mark last posted slot / dex cache" || exit 0
          git push
